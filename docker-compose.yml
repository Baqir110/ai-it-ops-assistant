services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-it-ops-api
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      CPU_THRESHOLD: "85.0"
      RAM_THRESHOLD: "85.0"
      DISK_THRESHOLD: "90.0"

      VECTOR_STORE_PATH: "./data/vector_store"
      RUNBOOKS_PATH: "./data/runbooks"
      LOG_LEVEL: "info"

    volumes:
      - ./app:/app/app
      - ./data:/app/data

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - monitoring

  postgres:
    image: postgres:16
    container_name: ai-it-ops-postgres

    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - monitoring

  redis:
    image: redis:7
    container_name: ai-it-ops-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-it-ops-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      api:
        condition: service_started

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ai-it-ops-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: "AI IT Operations"
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS

      GF_LOG_LEVEL: debug
      GF_LOG_FILTERS: "smtp:debug"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

    networks:
      - monitoring

networks:
  monitoring:
    name: ai-it-ops-monitoring
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: