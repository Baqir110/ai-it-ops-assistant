apiVersion: v1
kind: ConfigMap
metadata:
  name: opsguard-config
  namespace: opsguard
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PROMETHEUS_URL: "http://prometheus:9090"
  PROMETHEUS_ENABLED: "true"
  FAILURE_SIMULATOR_ENABLED: "false"
  CPU_THRESHOLD: "85.0"
  RAM_THRESHOLD: "85.0"
  DISK_THRESHOLD: "90.0"
  VECTOR_STORE_PATH: "/app/data/chroma_db"
  RUNBOOKS_PATH: "/app/data/runbooks"
