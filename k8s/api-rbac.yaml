apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsguard
  namespace: opsguard

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opsguard
  namespace: opsguard
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opsguard
  namespace: opsguard
subjects:
  - kind: ServiceAccount
    name: opsguard
    namespace: opsguard
roleRef:
  kind: Role
  name: opsguard
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opsguard-api
  namespace: opsguard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: opsguard-api

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsguard-api
  namespace: opsguard
spec:
  podSelector:
    matchLabels:
      app: opsguard-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: opsguard
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: opsguard
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
