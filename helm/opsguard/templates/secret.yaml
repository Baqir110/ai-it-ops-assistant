apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsguard.fullname" . }}-secrets
  labels:
    {{- include "opsguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.config.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.config.REDIS_URL | quote }}
  JWT_SECRET_KEY: {{ .Values.config.JWT_SECRET_KEY | quote }}
  OPENAI_API_KEY: {{ .Values.config.OPENAI_API_KEY | quote }}
